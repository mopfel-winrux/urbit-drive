# Build and package the drive client; on a v* tag, publish a GitHub release
# (the planet's web page links to .../releases/latest).
#
# Layout: this repo at ./urbit-drive and libmesa at ./libmesa/libmesa, so
# the client's relative path (go.mod's replace)
# resolve as in development.
#
# Secrets (all optional; without them artifacts are unsigned):
#   LIBMESA_TOKEN          if mopfel-winrux/libmesa is private
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD      notarization
#   WINDOWS_PFX_BASE64, WINDOWS_PFX_PASSWORD
# Variables:
#   WINDOWS_BUILDS = true  also build the Inno Setup installer (and sign) on
#                          a Windows runner; the Windows zip is always
#                          cross-compiled by the linux job
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.15.2
  GO_VERSION: '1.26.x'

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with: { path: urbit-drive, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: mopfel-winrux/libmesa
          path: libmesa/libmesa
          token: ${{ secrets.LIBMESA_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: urbit-drive/client/go.sum
      - name: test
        if: matrix.arch == 'amd64'
        working-directory: libmesa/libmesa
        run: zig build -Dno-host=true -Doptimize=ReleaseFast && cd ../../urbit-drive/client && go vet ./... && go test ./...
      - name: build and package
        working-directory: urbit-drive/client
        run: make dist-linux-${{ matrix.arch }}
      - name: cross-compile for Windows (zip, unsigned)
        if: matrix.arch == 'amd64'
        working-directory: urbit-drive/client
        run: make dist-windows-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: urbit-drive/client/dist/*

  darwin:
    strategy:
      matrix:
        include:
          - { arch: arm64, os: macos-14 }
          - { arch: amd64, os: macos-13 }
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
        with: { path: urbit-drive, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: mopfel-winrux/libmesa
          path: libmesa/libmesa
          token: ${{ secrets.LIBMESA_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: urbit-drive/client/go.sum
      - name: import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/sign.keychain-db; KP=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: build and package
        working-directory: urbit-drive/client
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: make dist-darwin-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: urbit-drive/client/dist/*

  windows:
    # the installer needs Inno Setup, so a Windows runner; opt in
    if: vars.WINDOWS_BUILDS == 'true'
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
        with: { path: urbit-drive, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: mopfel-winrux/libmesa
          path: libmesa/libmesa
          token: ${{ secrets.LIBMESA_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: urbit-drive/client/go.sum
      - name: certificate
        if: env.WINDOWS_PFX_BASE64 != ''
        run: echo "$WINDOWS_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.pfx" && echo "WINDOWS_PFX=$RUNNER_TEMP/sign.pfx" >> $GITHUB_ENV
      - name: build and package (zip, and the Inno Setup installer)
        working-directory: urbit-drive/client
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          make dist-windows-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: urbit-drive/client/dist/*

  release:
    needs: [linux, darwin, windows]
    # the windows job is opt-in; publish without it
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' && needs.darwin.result == 'success' && needs.windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          repository: mopfel-winrux/urbit-drive
          files: dist/*
          generate_release_notes: true
