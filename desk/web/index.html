<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive</title>
  <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1918" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/drive/tile.svg">
  <link rel="manifest" href="/drive/manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="/drive/style.css">
</head>
<body>
  <!-- one line-icon set, 24px grid, 1.75 stroke -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.38l2 2H19.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
      <symbol id="i-folder-shared" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.38l2 2H19.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="11.5" r="1.8"/><path d="M8.8 16.5a3.4 3.4 0 0 1 6.4 0"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3h7l4 4v12.5A1.5 1.5 0 0 1 16 21H6.5A1.5 1.5 0 0 1 5 19.5v-15A1.5 1.5 0 0 1 6.5 3z"/><path d="M13.5 3v4h4"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4.5M7.5 9 12 4.5 16.5 9M5 15.5v3A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-3"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.5V16M7.5 11.5 12 16l4.5-4.5M5 15.5v3A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-3"/></symbol>
      <symbol id="i-plus-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.38l2 2H19.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M12 10.5v5M9.5 13h5"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M17.5 8v6M14.5 11h6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.5h5v2M6.5 6.5l1 13h9l1-13M10 10.5v6M14 10.5v6"/></symbol>
      <symbol id="i-rename" viewBox="0 0 24 24"><path d="m14.5 5.5 4 4L9 19H5v-4z"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.38l2 2H19.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M9 13h6M12.5 10.5 15 13l-2.5 2.5"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/><path d="M12 8v4.5l3 1.8"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/></symbol>
      <symbol id="i-computer" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="11" rx="1.5"/><path d="M8.5 19.5h7M12 16v3.5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-desktop-app" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="11" rx="1.5"/><path d="M8.5 19.5h7M12 16v3.5M12 7.5v5.5M9.8 10.8 12 13l2.2-2.2"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="rail" id="rail">
      <a class="brand" href="#/"><img src="/drive/tile.svg" alt="" width="28" height="28"><span>Drive</span></a>
      <nav aria-label="Drive">
        <a href="#/" data-nav="folders"><svg class="ic"><use href="#i-folder"/></svg>Folders</a>
        <a href="#/activity" data-nav="activity"><svg class="ic"><use href="#i-activity"/></svg>Activity</a>
        <a href="#/more" data-nav="more"><svg class="ic"><use href="#i-more"/></svg>More</a>
      </nav>
      <div class="rail-foot">
        <div class="usage" id="usage"></div>
        <a class="get-app" href="https://github.com/mopfel-winrux/urbit-drive/releases/latest" target="_blank" rel="noopener">
          <svg class="ic"><use href="#i-desktop-app"/></svg>Get the desktop app</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-narrow" id="open-rail" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
        <label class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search files">
        </label>
        <span class="who" id="who" title="Your ship"></span>
      </header>

      <div class="body">
        <section class="content" id="content" aria-live="polite"></section>
        <aside class="details" id="details" hidden></aside>
      </div>
    </div>
  </div>

  <div class="drop-veil" id="drop-veil" hidden><div><svg class="ic"><use href="#i-upload"/></svg><p>Drop files to upload to <b id="drop-target"></b></p></div></div>
  <div class="progress" id="progress" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="dialog"></dialog>
  <input type="file" id="file-input" multiple hidden>

  <script src="/drive/ship.js"></script>
  <script src="/drive/app.js"></script>
</body>
</html>
