<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive</title>
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" href="/drive/tile.svg">
  <link rel="manifest" href="/drive/manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="/drive/style.css">
</head>
<body>
  <header><img src="/drive/tile.svg" alt="" class="logo"><h1>Drive</h1><span id="ship" class="muted"></span><span id="status" class="muted">connecting…</span>
    <a class="download" href="https://github.com/mopfel-winrux/urbit-drive/releases/latest" target="_blank" rel="noopener">Get the desktop app</a></header>
  <main>
    <section id="invites-section" hidden>
      <h2>Invitations</h2>
      <ul id="invites" class="rows"></ul>
    </section>

    <section>
      <h2>Folders</h2>
      <div id="folders"></div>
      <form id="new-folder" class="inline">
        <input id="new-folder-name" placeholder="New folder name" autocomplete="off" required>
        <button>Create</button>
      </form>
    </section>

    <section>
      <h2>Devices</h2>
      <p class="muted">Each device is a moon of this ship. <a href="https://github.com/mopfel-winrux/urbit-drive/releases/latest" target="_blank" rel="noopener">Download the desktop app</a> for macOS, Windows or Linux, then pair it with this ship's address and <code>+code</code>.</p>
      <ul id="devices" class="rows"></ul>
    </section>
    <section>
      <h2>Storage</h2>
      <p id="stored" class="muted"></p>
      <form id="retention" class="inline">
        <label for="keep" class="muted">Keep deleted files and old versions for</label>
        <input id="keep" type="number" min="1" max="3650" style="max-width:90px;flex:0">
        <span class="muted">days</span>
        <button>Save</button>
        <button type="button" id="prune" class="quiet">Prune now</button>
      </form>
    </section>
  </main>
  <div id="toast" hidden></div>
  <!-- ship.js first (defines window.Ship), then the page logic -->
  <script src="/drive/ship.js"></script>
  <script src="/drive/app.js"></script>
</body>
</html>
